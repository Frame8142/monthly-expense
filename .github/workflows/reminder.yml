name: bill-reminder

on:
  schedule:
    # 09:00 เวลาไทย = 02:00 UTC
    - cron: '0 2 * * *'
    # 21:00 เวลาไทย = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning หรือ evening'
        required: false
        default: 'morning'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Send morning reminder (09:00 BKK)
        if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning')
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/send_reminder.py --mode morning
      - name: Send evening reminder (21:00 BKK)
        if: github.event.schedule == '0 14 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'evening')
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/send_reminder.py --mode evening
